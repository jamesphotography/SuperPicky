# pytest 配置 / pytest configuration
#
# 回归测试统一放在 tests/（issue #135）。testpaths 让不带参数的 `pytest`
# 只收集 tests/，根目录即便又冒出 test_*.py 也不会被默认执行。
# 共享夹具与全局防线在根目录 conftest.py，对 tests/ 同样生效。
#
# Regression tests live in tests/ (issue #135). testpaths limits a bare
# `pytest` run to that directory, so a stray root-level test_*.py is not
# collected by default. The shared fixtures in the root conftest.py still apply.
[pytest]
testpaths = tests
