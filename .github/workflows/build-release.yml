  build-mac:
    # Tag 推送始终构建全平台；手动触发时按 platform 选择。
    # Tag pushes always build all; manual runs honor the platform input.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'mac' }}
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_mac.txt

      - name: Resolve release metadata
        id: release_meta
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/ci_release.py resolve-metadata

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_mac.txt

      - name: Materialize signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: python scripts/ci_release.py materialize-secret-file --env-name MACOS_CERTIFICATE --output $RUNNER_TEMP/certificate.p12 --decode-base64

      # Developer ID Installer 证书（productsign 签 .pkg 用，与上面签 .app 的
      # Developer ID Application 是两张不同证书）。用于产出「pkg 装进 DMG」安装器。
      - name: Materialize installer certificate
        env:
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
        run: python scripts/ci_release.py materialize-secret-file --env-name MACOS_INSTALLER_CERTIFICATE --output $RUNNER_TEMP/installer_certificate.p12 --decode-base64

      # rcodesign：直接用 .p12 签 .pkg，不碰 macOS 钥匙串，绕开 CI 上 productsign
      # 取 Installer 私钥被钥匙串授权阻塞的问题（productsign 在 runner 上会无限挂起）。
      # rcodesign signs the .pkg straight from the .p12 (no keychain), avoiding the
      # headless-CI productsign keychain-prompt hang.
      - name: Install rcodesign
        run: |
          set -euo pipefail
          ver="0.29.0"
          url="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/${ver}/apple-codesign-${ver}-macos-universal.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/rcodesign.tar.gz" "$url"
          tar -xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP"
          bin="$(find "$RUNNER_TEMP" -name rcodesign -type f -perm -u+x | head -1)"
          sudo install -m 0755 "$bin" /usr/local/bin/rcodesign
          rcodesign --version

      - name: Build notarized macOS release
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          python build_release_mac.py --build-type full --arch arm64 --copy-dir output/mac --sign-p12 $RUNNER_TEMP/certificate.p12 --sign-p12-password-env MACOS_CERTIFICATE_PWD --installer-p12 $RUNNER_TEMP/installer_certificate.p12 --installer-p12-password-env MACOS_INSTALLER_CERTIFICATE_PWD --notarize --apple-id ${{ secrets.APPLE_ID }} --team-id ${{ secrets.MACOS_TEAM_ID }}

      - name: Build code patch zip
        run: python scripts/ci_release.py build-patch --output-dir output/mac --patch-version ${{ steps.release_meta.outputs.tag }}

      - name: Clean up
        if: always()
        run: python scripts/ci_release.py cleanup-paths --path _telemetry_build.py --path $RUNNER_TEMP/certificate.p12 --path $RUNNER_TEMP/installer_certificate.p12

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body_path: ChangeLog.md
          fail_on_unmatched_files: true
          # RC / 预发布 tag 标记为 prerelease，避免被当成正式版 / latest 推给用户。
          # Mark RC / pre-release tags as prerelease so they are not treated as
          # the latest stable release.
          prerelease: ${{ contains(steps.release_meta.outputs.tag, '-RC') || contains(steps.release_meta.outputs.tag, '-rc') }}
          files: |
            output/mac/*.dmg
            output/mac/code_patch_*.zip
            output/mac/patch_meta.json

