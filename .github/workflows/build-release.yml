name: Build and Release SuperPicky

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the release'
        required: true
      platform:
        description: 'Which platform(s) to build (manual runs only; tag pushes always build all)'
        type: choice
        default: all
        required: false
        options:
          - all
          - mac
          - windows

jobs:
  build-windows:
    # Tag 推送始终构建全平台；手动触发时按 platform 选择。
    # Tag pushes always build all; manual runs honor the platform input.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements_cuda.txt

      - name: Resolve release metadata
        id: release_meta
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/ci_release.py resolve-metadata

      # Windows 构建 Full CPU 与 Full CUDA 两个安装器：
      # - Full CPU：自带 CPU PyTorch + 所有模型，安装即用、完全离线。
      # - Full CUDA：自带 CUDA PyTorch，给 N 卡用户，见下方 artifact 说明。
      # 4.5.0 起不再构建 Lite：它首启才按硬件下载 PyTorch wheel 与模型，总下载量
      # 反而超过 Full CPU，且在大陆网络下极慢、失败率高，换来的只是一整套 uv
      # 运行时引导的复杂度。存量 Lite 用户需先卸载再装 Full（AppId 不同）。
      - name: Build Full CPU release
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: python build_release_win.py --build-type cpu --copy-dir output --no-zip

      - name: Create Full CPU installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./output/installer_cpu/SuperPicky.iss

      # Full CUDA installer 单文件预期 > 2 GiB，超过 GitHub Releases 单 asset 上限。
      # 因此 CUDA 产物只作为 workflow artifact 保留 90 天，由维护者手动转存到
      # 百度 / 夸克网盘等大文件分发渠道，不进入 release_assets。失败不阻塞
      # Full CPU 的 release 流程（continue-on-error）。
      - name: Build Full CUDA release
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: python build_release_win.py --build-type cuda --copy-dir output --no-zip

      - name: Create Full CUDA installer with Inno Setup
        id: cuda_inno
        continue-on-error: true
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./output/installer_cuda/SuperPicky-cuda.iss

      - name: Upload Full CUDA installer as workflow artifact
        if: steps.cuda_inno.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: SuperPicky_FullCUDA_Win64
          path: output/installer_cuda/Output/SuperPicky_Setup_FullCUDA_Win64_*.exe
          retention-days: 90
          if-no-files-found: warn

      - name: Prepare release assets
        run: |
          python scripts/ci_release.py collect-assets --output-dir release_assets --pattern output/installer_cpu/Output/SuperPicky_Setup_Full_Win64_*.exe

      - name: Build code patch zip
        run: python scripts/ci_release.py build-patch --output-dir release_assets --patch-version ${{ steps.release_meta.outputs.tag }}

      - name: Clean telemetry build override
        if: always()
        run: python scripts/ci_release.py cleanup-paths --path _telemetry_build.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body_path: ChangeLog.md
          fail_on_unmatched_files: true
          # RC / 预发布 tag 标记为 prerelease，避免被当成正式版 / latest 推给用户。
          # Mark RC / pre-release tags as prerelease so they are not treated as
          # the latest stable release.
          prerelease: ${{ contains(steps.release_meta.outputs.tag, '-RC') || contains(steps.release_meta.outputs.tag, '-rc') }}
          files: |
            release_assets/*

      # - name: Create GitCode Release
      #   continue-on-error: true
      #   shell: pwsh
      #   env:
      #     GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      #     TAG: ${{ steps.release_meta.outputs.tag }}
      #   run: |
      #     $baseUrl = "https://gitcode.com/api/v4/projects/Jamesphotography%2FSuperPicky"
      #     $tag = $env:TAG
      #     $headers = @{ "PRIVATE-TOKEN" = $env:GITCODE_TOKEN; "Content-Type" = "application/json" }
      #     $body = @{ tag_name = $tag; name = "SuperPicky $tag"; description = "See GitHub release for details." } | ConvertTo-Json
      #     try {
      #       Invoke-RestMethod -Uri "$baseUrl/releases" -Method Post -Body $body -Headers $headers -ErrorAction Stop
      #     } catch {
      #       Write-Host "Release already exists or creation failed, continuing..."
      #     }

      # - name: Update downloads_github.json and push
      #   shell: pwsh
      #   env:
      #     TAG: ${{ steps.release_meta.outputs.tag }}
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     REF: ${{ github.ref_name }}
      #   run: |
      #     $tag = $env:TAG
      #     $assets = gh release view $tag --json assets --jq '.assets[].name' 2>$null
      #     $macArm64 = ($assets | Where-Object { $_ -match '(?i)arm64.*\.dmg$' } | Select-Object -First 1)
      #     $winCpu   = ($assets | Where-Object { $_ -match '(?i)Setup.*Win.*\.exe$' } | Select-Object -First 1)
      #     $winCuda  = ($assets | Where-Object { $_ -match '(?i)CUDA.*Win.*\.exe$' } | Select-Object -First 1)
      #     $json = [ordered]@{
      #       beta = [ordered]@{
      #         tag        = $tag
      #         updated_at = (Get-Date -Format "o")
