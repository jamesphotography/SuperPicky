name: Build and Release SuperPicky

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the release'
        required: true
      platform:
        description: 'Which platform(s) to build (manual runs only; tag pushes always build all)'
        type: choice
        default: all
        required: false
        options:
          - all
          - mac
          - windows

jobs:
  build-windows:
    # Tag 推送始终构建全平台；手动触发时按 platform 选择。
    # Tag pushes always build all; manual runs honor the platform input.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements_cuda.txt

      - name: Resolve release metadata
        id: release_meta
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/ci_release.py resolve-metadata

      # Windows 构建 Full CPU 与 Full CUDA 两个安装器：
      # - Full CPU：自带 CPU PyTorch + 所有模型，安装即用、完全离线。
      # - Full CUDA：自带 CUDA PyTorch，给 N 卡用户，见下方 artifact 说明。
      # 4.5.0 起不再构建 Lite：它首启才按硬件下载 PyTorch wheel 与模型，总下载量
      # 反而超过 Full CPU，且在大陆网络下极慢、失败率高，换来的只是一整套 uv
      # 运行时引导的复杂度。存量 Lite 用户需先卸载再装 Full（AppId 不同）。
      - name: Build Full CPU release
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: python build_release_win.py --build-type cpu --copy-dir output --no-zip

      - name: Create Full CPU installer with Inno Setup
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./output/installer_cpu/SuperPicky.iss

      # Full CUDA installer 直接进 Release。GitHub 单 asset 上限是二进制
      # 2 GiB = 2,147,483,648 字节；实测 4.5.0-rc6 至 4.6.3-rc1 的 CUDA 安装器
      # 稳定在 1.962~1.967 GiB（约 2.11 GB 十进制显示），从未超限——早先「预期
      # > 2 GiB」是把十进制 GB 当成 GiB 的误判，网盘手动转存因此可以取消。
      # 余量只有约 35 MiB，所以 stage-optional-asset 带体积卡口：超限就自动回退
      # 到 workflow artifact 通道并发出 CI warning，不阻塞 Full CPU 的发布。
      # The CUDA installer now ships in the Release itself: the limit is 2 GiB
      # (binary), and measured builds sit at ~1.966 GiB. The size gate falls back
      # to the artifact channel if a future build ever crosses the limit.
      - name: Build Full CUDA release
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: python build_release_win.py --build-type cuda --copy-dir output --no-zip

      - name: Create Full CUDA installer with Inno Setup
        id: cuda_inno
        continue-on-error: true
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./output/installer_cuda/SuperPicky-cuda.iss

      - name: Prepare release assets
        run: |
          python scripts/ci_release.py collect-assets --output-dir release_assets --pattern output/installer_cpu/Output/SuperPicky_Setup_Full_Win64_*.exe

      # 体积卡口：在上限内则 staged=true 并随 Release 上传；超限或产物缺失则
      # staged=false，下一步回退到 workflow artifact。
      # Size gate: staged=true ships it in the Release; otherwise the next step
      # falls back to the workflow artifact.
      - name: Stage Full CUDA installer for release
        id: cuda_stage
        if: steps.cuda_inno.outcome == 'success'
        run: |
          python scripts/ci_release.py stage-optional-asset --output-dir release_assets --pattern "output/installer_cuda/Output/SuperPicky_Setup_FullCUDA_Win64_*.exe"

      - name: Upload Full CUDA installer as workflow artifact (fallback)
        if: steps.cuda_inno.outcome == 'success' && steps.cuda_stage.outputs.staged != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SuperPicky_FullCUDA_Win64
          path: output/installer_cuda/Output/SuperPicky_Setup_FullCUDA_Win64_*.exe
          retention-days: 90
          if-no-files-found: warn

      - name: Build code patch zip
        run: python scripts/ci_release.py build-patch --output-dir release_assets --patch-version ${{ steps.release_meta.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body_path: ChangeLog.md
          fail_on_unmatched_files: true
          # RC / 预发布 tag 标记为 prerelease，避免被当成正式版 / latest 推给用户。
          # Mark RC / pre-release tags as prerelease so they are not treated as
          # the latest stable release.
          prerelease: ${{ contains(steps.release_meta.outputs.tag, '-RC') || contains(steps.release_meta.outputs.tag, '-rc') }}
          files: |
            release_assets/*

      # - name: Create GitCode Release
      #   continue-on-error: true
      #   shell: pwsh
      #   env:
      #     GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      #     TAG: ${{ steps.release_meta.outputs.tag }}
      #   run: |
      #     $baseUrl = "https://gitcode.com/api/v4/projects/Jamesphotography%2FSuperPicky"
      #     $tag = $env:TAG
      #     $headers = @{ "PRIVATE-TOKEN" = $env:GITCODE_TOKEN; "Content-Type" = "application/json" }
      #     $body = @{ tag_name = $tag; name = "SuperPicky $tag"; description = "See GitHub release for details." } | ConvertTo-Json
      #     try {
      #       Invoke-RestMethod -Uri "$baseUrl/releases" -Method Post -Body $body -Headers $headers -ErrorAction Stop
      #     } catch {
      #       Write-Host "Release already exists or creation failed, continuing..."
      #     }

      # - name: Update downloads_github.json and push
      #   shell: pwsh
      #   env:
      #     TAG: ${{ steps.release_meta.outputs.tag }}
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     REF: ${{ github.ref_name }}
      #   run: |
      #     $tag = $env:TAG
      #     $assets = gh release view $tag --json assets --jq '.assets[].name' 2>$null
      #     $macArm64 = ($assets | Where-Object { $_ -match '(?i)arm64.*\.dmg$' } | Select-Object -First 1)
      #     $winCpu   = ($assets | Where-Object { $_ -match '(?i)Setup.*Win.*\.exe$' } | Select-Object -First 1)
      #     $winCuda  = ($assets | Where-Object { $_ -match '(?i)CUDA.*Win.*\.exe$' } | Select-Object -First 1)
      #     $json = [ordered]@{
      #       beta = [ordered]@{
      #         tag        = $tag
      #         updated_at = (Get-Date -Format "o")
      #         files      = [ordered]@{
      #           mac_arm64 = if ($macArm64) { $macArm64 } else { $null }
      #           win_cpu   = if ($winCpu)   { $winCpu }   else { $null }
      #           win_cuda  = if ($winCuda)  { $winCuda }  else { $null }
      #         }
      #       }
      #     }
      #     $jsonContent = $json | ConvertTo-Json -Depth 5
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git fetch origin nightly
      #     git checkout -B nightly origin/nightly
      #     $jsonContent | Out-File -Encoding utf8NoBOM "docs/downloads_github.json"
      #     git add docs/downloads_github.json
      #     git diff --cached --quiet && exit 0
      #     git commit -m "chore(web): 自动更新 downloads_github.json → $tag [skip ci]"
      #     git push origin HEAD:nightly

  # 第四个安装包：CUDA 13（PyTorch 2.14.1+cu130），给 RTX 50 系列等新显卡。
  # cu118 版没有 sm_120 的 GPU 代码，RTX 50 只能回退 CPU；cu130 覆盖 GTX 16 到 RTX 50，
  # 但没有 GTX 9/10 系列，所以 CUDA 11.8 版继续保留。驱动须 580 或更新。
  # 安装包约 2.22 GB，超过 GitHub 单文件上限 2 GiB（cu130 的 GPU 库已预压缩，LZMA 压不动；
  # 删未引用 DLL 实测只省 29 MiB），所以用 Inno DiskSpanning 分卷：一个 .exe 加若干 .bin，
  # 每片不超过 2,100,000,000 字节，必须放在同一文件夹且不能改名。
  # 单独一个 job 并行构建：与 CPU/CUDA 11.8 不抢 runner 磁盘，失败也不影响其他三个包。
  # Fourth installer: CUDA 13 (torch 2.14.1+cu130) for RTX 50 and newer. cu118
  # has no sm_120 kernels; cu130 covers GTX 16..RTX 50 but not GTX 9/10, so the
  # CUDA 11.8 build stays. ~2.22 GB exceeds the 2 GiB asset limit, so Inno disk
  # spanning splits it into an .exe plus .bin slices (same folder, names unchanged).
  # A separate parallel job: no disk contention, and a failure here never blocks
  # the other three installers.
  build-windows-cuda13:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements_base.txt
            requirements_cuda13.txt

      - name: Resolve release metadata
        id: release_meta
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/ci_release.py resolve-metadata

      - name: Build Full CUDA 13 release
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          SUPERPICKY_CUDA_REQUIREMENTS: requirements_cuda13.txt
        run: python build_release_win.py --build-type cuda --copy-dir output --no-zip

      # 打包进去的 torch 必须是 cu130，否则会发出一个名不副实的安装包
      # The bundled torch must be cu130, or we'd ship a mislabeled installer
      - name: Verify bundled torch is CUDA 13
        shell: pwsh
        run: |
          $out = .\.venv-cuda\Scripts\python.exe -c "import torch; print(torch.__version__, torch.version.cuda); print(' '.join(torch.cuda.get_arch_list()))"
          $out
          if (-not ($out -match '\+cu130')) { throw 'bundled torch is not cu130' }
          if (-not ($out -match 'sm_120')) { throw 'sm_120 missing from arch list' }

      # 分卷 + 文件名改成 FullCUDA13，与 CUDA 11.8 版区分；仓库里的 inno 模板不动
      # Disk spanning + FullCUDA13 file name, patched on the staged script only
      - name: Enable disk spanning and CUDA 13 file name
        shell: pwsh
        run: |
          $iss = 'output/installer_cuda/SuperPicky-cuda.iss'
          $text = Get-Content $iss -Raw -Encoding UTF8
          if ($text -notmatch '(?m)^\[Setup\]\r?$') { throw '[Setup] section not found' }
          if ($text -notmatch 'SuperPicky_Setup_FullCUDA_Win64_') { throw 'OutputBaseFilename prefix not found' }
          $text = $text -replace '(?m)^\[Setup\]\r?$', "[Setup]`r`nDiskSpanning=yes`r`nDiskSliceSize=2100000000"
          $text = $text.Replace('SuperPicky_Setup_FullCUDA_Win64_', 'SuperPicky_Setup_FullCUDA13_Win64_')
          Set-Content $iss $text -Encoding UTF8 -NoNewline
          Select-String -Path $iss -Pattern 'DiskSpanning|DiskSliceSize|OutputBaseFilename'

      - name: Create spanned Full CUDA 13 installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./output/installer_cuda/SuperPicky-cuda.iss

      # 每片都必须低于 2 GiB，且 .exe 与 .bin 都在
      # Every slice must be under 2 GiB, and both .exe and .bin must exist
      - name: Check slice sizes
        shell: pwsh
        run: |
          $files = Get-ChildItem output/installer_cuda/Output/SuperPicky_Setup_FullCUDA13_Win64_*
          if (-not ($files | Where-Object Extension -eq '.exe')) { throw 'setup .exe missing' }
          if (-not ($files | Where-Object Extension -eq '.bin')) { throw 'no .bin slices' }
          foreach ($f in $files) {
            '{0}: {1} bytes' -f $f.Name, $f.Length
            if ($f.Length -ge 2147483648) { throw "$($f.Name) exceeds 2 GiB" }
          }

      # 在 runner 上静默安装一次，核对装出来的文件与打包前完全一致（分卷能正确合回）
      # Silent install on the runner; installed files must match the staged app
      - name: Silent install and verify
        shell: pwsh
        run: |
          $exe = Get-ChildItem output/installer_cuda/Output/SuperPicky_Setup_FullCUDA13_Win64_*.exe | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP 'sp_install'
          $p = Start-Process $exe.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dest", "/LOG=$env:RUNNER_TEMP\sp_install.log" -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\sp_install.log" -Tail 40; throw 'install failed' }
          $src = Get-ChildItem output/installer_cuda/_internal -Recurse -File
          $dst = Get-ChildItem (Join-Path $dest '_internal') -Recurse -File
          $srcBytes = ($src | Measure-Object Length -Sum).Sum
          $dstBytes = ($dst | Measure-Object Length -Sum).Sum
          'staged _internal: {0} files, {1} bytes' -f $src.Count, $srcBytes
          'installed _internal: {0} files, {1} bytes' -f $dst.Count, $dstBytes
          if (-not (Test-Path (Join-Path $dest 'SuperPicky.exe'))) { throw 'SuperPicky.exe missing' }
          if ($src.Count -ne $dst.Count -or $srcBytes -ne $dstBytes) { throw 'installed files differ from staged files' }
          'install verified'

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body_path: ChangeLog.md
          fail_on_unmatched_files: true
          # RC / 预发布 tag 标记为 prerelease / Mark RC tags as prerelease.
          prerelease: ${{ contains(steps.release_meta.outputs.tag, '-RC') || contains(steps.release_meta.outputs.tag, '-rc') }}
          files: |
            output/installer_cuda/Output/SuperPicky_Setup_FullCUDA13_Win64_*.exe
            output/installer_cuda/Output/SuperPicky_Setup_FullCUDA13_Win64_*.bin

  build-mac:
    # Tag 推送始终构建全平台；手动触发时按 platform 选择。
    # Tag pushes always build all; manual runs honor the platform input.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'mac' }}
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements_mac.txt

      - name: Resolve release metadata
        id: release_meta
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/ci_release.py resolve-metadata

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_mac.txt

      - name: Materialize signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: python scripts/ci_release.py materialize-secret-file --env-name MACOS_CERTIFICATE --output $RUNNER_TEMP/certificate.p12 --decode-base64

      # Developer ID Installer 证书（productsign 签 .pkg 用，与上面签 .app 的
      # Developer ID Application 是两张不同证书）。用于产出「pkg 装进 DMG」安装器。
      - name: Materialize installer certificate
        env:
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
        run: python scripts/ci_release.py materialize-secret-file --env-name MACOS_INSTALLER_CERTIFICATE --output $RUNNER_TEMP/installer_certificate.p12 --decode-base64

      # rcodesign：直接用 .p12 签 .pkg，不碰 macOS 钥匙串，绕开 CI 上 productsign
      # 取 Installer 私钥被钥匙串授权阻塞的问题（productsign 在 runner 上会无限挂起）。
      # rcodesign signs the .pkg straight from the .p12 (no keychain), avoiding the
      # headless-CI productsign keychain-prompt hang.
      - name: Install rcodesign
        run: |
          set -euo pipefail
          ver="0.29.0"
          url="https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/${ver}/apple-codesign-${ver}-macos-universal.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/rcodesign.tar.gz" "$url"
          tar -xzf "$RUNNER_TEMP/rcodesign.tar.gz" -C "$RUNNER_TEMP"
          bin="$(find "$RUNNER_TEMP" -name rcodesign -type f -perm -u+x | head -1)"
          sudo install -m 0755 "$bin" /usr/local/bin/rcodesign
          rcodesign --version

      - name: Build notarized macOS release
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_INSTALLER_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PWD }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          python build_release_mac.py --build-type full --arch arm64 --copy-dir output/mac --sign-p12 $RUNNER_TEMP/certificate.p12 --sign-p12-password-env MACOS_CERTIFICATE_PWD --installer-p12 $RUNNER_TEMP/installer_certificate.p12 --installer-p12-password-env MACOS_INSTALLER_CERTIFICATE_PWD --notarize --apple-id ${{ secrets.APPLE_ID }} --team-id ${{ secrets.MACOS_TEAM_ID }}

      - name: Build code patch zip
        run: python scripts/ci_release.py build-patch --output-dir output/mac --patch-version ${{ steps.release_meta.outputs.tag }}

      - name: Clean up
        if: always()
        run: python scripts/ci_release.py cleanup-paths --path $RUNNER_TEMP/certificate.p12 --path $RUNNER_TEMP/installer_certificate.p12

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body_path: ChangeLog.md
          fail_on_unmatched_files: true
          # RC / 预发布 tag 标记为 prerelease，避免被当成正式版 / latest 推给用户。
          # Mark RC / pre-release tags as prerelease so they are not treated as
          # the latest stable release.
          prerelease: ${{ contains(steps.release_meta.outputs.tag, '-RC') || contains(steps.release_meta.outputs.tag, '-rc') }}
          files: |
            output/mac/*.dmg
            output/mac/code_patch_*.zip
            output/mac/patch_meta.json

