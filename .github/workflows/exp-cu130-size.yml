# 实验：用 PyTorch cu130 打 Full CUDA 安装包，只量体积，不建 tag、不建 Release。
# 仅在推送 exp/cu130-size 分支时运行；产物作为短期 artifact 上传。
# Experiment: build the Full CUDA installer on PyTorch cu130 to measure its size.
# Runs only on pushes to exp/cu130-size; never creates a tag or a Release.
name: Experiment cu130 installer size

# 体积实验已完成（run 40616343752 / 40636657458）；改为只能手动触发，
# 免得后续推送这个分支时又重新构建 40 分钟。
# Size runs are done; manual-only so later pushes don't rebuild for 40 minutes.
on:
  workflow_dispatch:

jobs:
  build-cuda-size:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Full CUDA release
        env:
          RELEASE_TAG: v0.0.0-exp-cu130
        run: python build_release_win.py --build-type cuda --copy-dir output --no-zip

      # 打包后的 torch 版本、显卡架构列表、torch/lib 里最大的 DLL
      # Bundled torch version, arch list and the largest DLLs in torch/lib
      - name: Report bundled torch
        shell: pwsh
        run: |
          .\.venv-cuda\Scripts\python.exe -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda); print('arch', torch.cuda.get_arch_list())"
          Get-ChildItem output/installer_cuda/_internal/torch/lib -Filter *.dll |
            Sort-Object Length -Descending | Select-Object -First 25 |
            ForEach-Object { '{0,8:N0} MiB  {1}' -f ($_.Length / 1MB), $_.Name }
          $total = (Get-ChildItem output/installer_cuda -Recurse -File | Measure-Object Length -Sum).Sum
          'staged app total: {0:N0} MiB' -f ($total / 1MB)

      # 分卷：安装数据拆成 Setup-*.bin，每片不超过 Inno 默认的 2,100,000,000 字节
      # （低于 GitHub 单文件上限 2,147,483,648）。不删任何额外 DLL。
      # Disk spanning: data goes into Setup-*.bin slices of at most Inno's default
      # 2,100,000,000 bytes (under GitHub's 2 GiB asset limit). No extra DLLs removed.
      - name: Enable disk spanning in CUDA installer script
        shell: pwsh
        run: |
          $iss = 'output/installer_cuda/SuperPicky-cuda.iss'
          $text = Get-Content $iss -Raw -Encoding UTF8
          if ($text -notmatch '(?m)^\[Setup\]\r?$') { throw '[Setup] section not found' }
          $text = $text -replace '(?m)^\[Setup\]\r?$', "[Setup]`r`nDiskSpanning=yes`r`nDiskSliceSize=2100000000"
          Set-Content $iss $text -Encoding UTF8 -NoNewline
          Select-String -Path $iss -Pattern 'DiskSpanning|DiskSliceSize|^Compression|SolidCompression'

      - name: Create spanned Full CUDA installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: ./output/installer_cuda/SuperPicky-cuda.iss

      - name: Measure spanned installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force sizes | Out-Null
          Move-Item output/installer_cuda/Output/* sizes/
          $sum = 0
          foreach ($f in Get-ChildItem sizes) {
            $sum += $f.Length
            $flag = if ($f.Length -lt 2147483648) { 'OK' } else { 'OVER' }
            '{0}: {1} bytes ({2:N1} MiB) {3}' -f $f.Name, $f.Length, ($f.Length / 1MB), $flag
            if ($f.Length -ge 2147483648) { throw "$($f.Name) exceeds 2 GiB" }
          }
          'total: {0} bytes ({1:N1} MiB)' -f $sum, ($sum / 1MB)

      # 在 runner 上静默安装一次，核对装出来的文件数和总字节数与打包前一致
      # Silent install on the runner and compare file count / bytes with the staged app
      - name: Silent install and verify
        shell: pwsh
        run: |
          $exe = Get-ChildItem sizes/*.exe | Select-Object -First 1
          $dest = Join-Path $env:RUNNER_TEMP 'sp_install'
          $p = Start-Process $exe.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dest", "/LOG=$env:RUNNER_TEMP\sp_install.log" -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\sp_install.log" -Tail 40; throw 'install failed' }
          $src = Get-ChildItem output/installer_cuda/_internal -Recurse -File
          $dst = Get-ChildItem (Join-Path $dest '_internal') -Recurse -File
          $srcBytes = ($src | Measure-Object Length -Sum).Sum
          $dstBytes = ($dst | Measure-Object Length -Sum).Sum
          'staged _internal: {0} files, {1} bytes' -f $src.Count, $srcBytes
          'installed _internal: {0} files, {1} bytes' -f $dst.Count, $dstBytes
          if (-not (Test-Path (Join-Path $dest 'SuperPicky.exe'))) { throw 'SuperPicky.exe missing' }
          if ($src.Count -ne $dst.Count -or $srcBytes -ne $dstBytes) { throw 'installed files differ from staged files' }
          'install verified'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: exp-cu130-installers
          path: sizes/*
          retention-days: 3
          compression-level: 0
